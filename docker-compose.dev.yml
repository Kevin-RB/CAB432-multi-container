# This was the way to test the app locally using docker-compose.
# It uses local builds and mounts local AWS credentials.

name: receipt-app

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    environment:
      - VITE_API_BASE_URL=http://localhost:3000
    ports:
      - "3001:3000"  # Using Node.js serve on port 3000
    depends_on:
      - api
    networks:
      - app-net
    develop:
      watch:
        - action: sync
          path: ./frontend
          target: /app
          ignore:
            - node_modules/
            - dist/
            - .git/
        - action: rebuild
          path: ./frontend/package.json

  api:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env.local
    environment:
      - PORT=3000
      - AWS_PROFILE=default
      - AWS_SDK_LOAD_CONFIG=1
      - AWS_EC2_METADATA_DISABLED=true
      - MEMCACHED_URL=memcached:11211  # Local
    volumes:
      - ${USERPROFILE}/.aws:/root/.aws:ro
    networks:
      - app-net
    depends_on:
      - ollama
      - tesseract
    develop:
      watch:
        - action: sync+restart
          path: ./backend
          target: /usr/src/app
          ignore:
            - node_modules/
        - action: rebuild
          path: package.json

  tesseract:
    build:
      context: ./tesseract-ocr
      dockerfile: Dockerfile
    networks:
      - app-net
    healthcheck:
      test: ["CMD", "tesseract --version"]
      interval: 1m
      timeout: 5s
      retries: 3
      start_period: 30s
    develop:
      watch:
        - action: sync+restart
          path: ./tesseract-ocr
          target: /app
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    networks:
      - app-net
    depends_on:
      ollama-init:
        condition: service_completed_successfully

  ollama-init:
    image: ollama/ollama:latest
    container_name: ollama-init
    volumes:
      - ollama:/root/.ollama
    networks:
      - app-net
    entrypoint: >
      sh -c "
      ollama serve &
      sleep 10 &&
      ollama pull gemma3:1b &&
      pkill ollama
      "
    restart: "no"

  memcached:
    image: memcached:1.6-alpine
    container_name: memcached-local
    ports:
      - "11211:11211"
    command: memcached -m 64  # 64MB memory limit (matches ElastiCache t4g.micro)
    networks:
      - app-net
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "11211"]
      interval: 30s
      timeout: 5s
      retries: 3

  ocr-worker:
    build: ./ocr-worker
    env_file:
      - .env
    volumes:
      - ${USERPROFILE}/.aws:/root/.aws:ro
    depends_on:
      - tesseract
    networks:
      - app-net
    restart: unless-stopped
    develop:
      watch:
        - action: sync+restart
          path: ./ocr-worker
          target: /usr/src/app
          ignore:
            - node_modules/
        - action: rebuild
          path: package.json

  llm-worker:
    build: ./llm-worker
    env_file:
      - .env
    volumes:
      - ${USERPROFILE}/.aws:/root/.aws:ro
    depends_on:
      - ollama
    networks:
      - app-net
    restart: unless-stopped
    develop:
      watch:
        - action: sync+restart
          path: ./llm-worker
          target: /usr/src/app
          ignore:
            - node_modules/
        - action: rebuild
          path: package.json
    
networks:
  app-net:

volumes:
  ollama: