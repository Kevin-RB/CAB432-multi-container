name: receipt-app

services:
  frontend:
    image: 901444280953.dkr.ecr.ap-southeast-2.amazonaws.com/n12112798-kr-m5:frontend-v2.0.0
    ports:
      - "80:3000"  # EC2:80 → Container:3000 (matches your Dockerfile)
    networks:
      - app-net
    depends_on:
      - api
    restart: unless-stopped

  api:
    image: 901444280953.dkr.ecr.ap-southeast-2.amazonaws.com/n12112798-kr-m5:api-prod-v2.0.0
    ports:
      - "3000:3000" # Direct external API access
    volumes:
      # Mount AWS config files so container can use your SSO credentials
      - ~/.aws:/root/.aws:ro
    networks:
      - app-net
    depends_on:
      - ollama
      - tesseract
    restart: unless-stopped

  tesseract:
    image: 901444280953.dkr.ecr.ap-southeast-2.amazonaws.com/n12112798-kr-m5:tesseract-v1.0
    networks:
      - app-net
    healthcheck:
      test: ["CMD", "tesseract --version"]
      interval: 1m
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    networks:
      - app-net
    depends_on:
      ollama-init:
        condition: service_completed_successfully
    restart: unless-stopped

  ollama-init:
    image: ollama/ollama:latest
    container_name: ollama-init
    volumes:
      - ollama:/root/.ollama
    networks:
      - app-net
    entrypoint: >
      sh -c "
      ollama serve &
      sleep 10 &&
      ollama pull gemma3:1b &&
      pkill ollama
      "
    restart: "no"

networks:
  app-net:

volumes:
  ollama:
