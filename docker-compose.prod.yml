name: receipt-app

services:
  # Nginx reverse proxy - the only service exposed to the internet
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"  # Only expose port 80 to the internet
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf  # Mount our config
    depends_on:
      frontend:
        condition: service_started
      api:
        condition: service_started
    networks:
      - app-net
    restart: unless-stopped
  frontend:
    image: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/n12112798-kr-m5:frontend-v1.0.2
    # ports:
    #   - "80:3000"  # EC2:80 → Container:3000 (matches your Dockerfile)
    environment:
      - VITE_API_BASE_URL=/api
      - VITE_YOUTUBE_API_KEY=${VITE_YOUTUBE_API_KEY}
    networks:
      - app-net
    depends_on:
      - api
    restart: unless-stopped

  api:
    image: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/n12112798-kr-m5:api-prod-v1.0.0
    ports:
      - "3000:3000" # Direct external API access
    environment:
      - PORT=3000
    networks:
      - app-net
    depends_on:
      - ollama
      - tesseract
    restart: unless-stopped

  tesseract:
    image: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/n12112798-kr-m5:tesseract-v1.0
    networks:
      - app-net
    healthcheck:
      test: ["CMD", "tesseract --version"]
      interval: 1m
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    networks:
      - app-net
    depends_on:
      ollama-init:
        condition: service_completed_successfully
    restart: unless-stopped

  ollama-init:
    image: ollama/ollama:latest
    container_name: ollama-init
    volumes:
      - ollama:/root/.ollama
    networks:
      - app-net
    entrypoint: >
      sh -c "
      ollama serve &
      sleep 10 &&
      ollama pull deepseek-r1:1.5b &&
      pkill ollama
      "
    restart: "no"

networks:
  app-net:

volumes:
  ollama:
