name: receipt-app

services:
  api:
    image: 901444280953.dkr.ecr.ap-southeast-2.amazonaws.com/n12112798-kr-m5:api-prod-v3.0.4
    ports:
      - "3000:3000" # Direct external API access
    environment:
      - AWS_REGION=ap-southeast-2
    # Removed credential mounting - using IAM instance role instead
    networks:
      - app-net
    depends_on:
      - ollama
      - tesseract
    restart: unless-stopped

  ocr-worker:
    image: 901444280953.dkr.ecr.ap-southeast-2.amazonaws.com/n12112798-kr-m5:ocr-worker-v1.0.1
    environment:
      - AWS_REGION=ap-southeast-2
      - OCR_QUEUE_URL=https://sqs.ap-southeast-2.amazonaws.com/901444280953/cosmic-tesseract
      - LLM_QUEUE_URL=https://sqs.ap-southeast-2.amazonaws.com/901444280953/cosmic-llm
      - S3_BUCKET_NAME=n12112798-cosmic-storage
      - TESSERACT_URL=http://tesseract:3001
    networks:
      - app-net
    depends_on:
      - tesseract
    restart: unless-stopped

  llm-worker:
    image: 901444280953.dkr.ecr.ap-southeast-2.amazonaws.com/n12112798-kr-m5:llm-worker-v1.0.1
    environment:
      - AWS_REGION=ap-southeast-2
      - LLM_QUEUE_URL=https://sqs.ap-southeast-2.amazonaws.com/901444280953/cosmic-llm
      - RECEIPTS_TABLE_NAME=n12112798-CosmicStorage
      - OLLAMA_URL=http://n12112798-cosmic-internal-alb-278330678.ap-southeast-2.elb.amazonaws.com:11434
      - NUM_THREADS=2
    networks:
      - app-net
    restart: unless-stopped

  tesseract:
    image: 901444280953.dkr.ecr.ap-southeast-2.amazonaws.com/n12112798-kr-m5:tesseract-v1.0
    networks:
      - app-net
    healthcheck:
      test: ["CMD", "tesseract --version"]
      interval: 1m
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "3002:11434"  # Map external 3002 to internal 11434
    volumes:
      - ollama:/root/.ollama
    networks:
      - app-net
    depends_on:
      ollama-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pgrep ollama || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  ollama-init:
    image: ollama/ollama:latest
    container_name: ollama-init
    volumes:
      - ollama:/root/.ollama
    networks:
      - app-net
    entrypoint: >
      sh -c "
      ollama serve &
      sleep 5 &&
      if ! ollama list | grep -q 'gemma3:1b'; then
        ollama pull gemma3:1b
      fi &&
      pkill ollama
      "
    restart: "no"

networks:
  app-net:

volumes:
  ollama:
