events {
    worker_connections 1024;
}

http {
    # Include MIME types for proper file serving
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Define upstream servers (internal Docker network communication)
    upstream frontend {
        server frontend:3000;  # Points to frontend container
    }
    
    upstream api {
        server api:3000;       # Points to api container
    }

    # Main server configuration
    server {
        listen 80;
        server_name _;  # Accept any domain name
        
        # Serve frontend for all root paths
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Handle React Router (SPA routing)
            try_files $uri $uri/ @fallback;
        }
        
        # Fallback for React Router
        location @fallback {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
        }
        
        # Route API requests to backend
        location /api {
            proxy_pass http://api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}